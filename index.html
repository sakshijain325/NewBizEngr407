<style>
/* Layout: sticky role-aware nav; hash-routed views rendered into one centered column (max 1140px); animal profiles open in a right-side panel, records and confirmations in centered dialogs */
:root{
  --bg:#FFF8EE; --surface:#FFFFFF; --sunk:#FBF0DF; --ink:#0C3439; --muted:#55696A; --line:#EDE1CC;
  --teal:#077F79; --on-teal:#FFFFFF; --teal-fill:#06958E; --teal-soft:#D6EFEC;
  --coral:#F96B57; --coral-ink:#BE4535; --coral-soft:#FEE3DE;
  --yellow:#F4D6A0; --yellow-soft:#FCEFD6; --cream-deep:#F5E7CF;
  --good:#2B7A4B; --warn:#A8620F; --bad:#B53A2D;
  --tile-ink:#0C3439;
  --f-display:"Fredoka","Nunito","Avenir Next Rounded",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next",system-ui,sans-serif;
  --f-mono:"Nunito","Avenir Next",system-ui,sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,4.8vw,3.5rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,2.8vw,2.05rem);font-weight:600}
h3{font-size:1.12rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--teal)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font:800 .72rem/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--teal);color:var(--on-teal)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-coral{background:var(--coral);color:#2A1210}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-sm{padding:7px 14px;font-size:.88rem}
.link{background:none;border:0;padding:0;color:var(--teal);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:var(--ink);font:700 1.6rem/1 var(--f-display);letter-spacing:-.01em}
.logo img{height:40px;width:auto;display:block}
.logo img.four{height:.92em;width:auto;display:inline-block;vertical-align:-.04em;margin:0 .06em 0 .1em}
.navlinks{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.navlinks a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.93rem;padding:4px 0;border-bottom:2px solid transparent}
.navlinks a[aria-current="page"]{color:var(--ink);border-color:var(--coral)}
.acct{display:flex;align-items:center;gap:10px;font-size:.85rem;border-left:1px solid var(--line);padding-left:14px}
.acct b{display:block;font-size:.88rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#3A2A08;flex:none}
.count{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:99px;background:var(--coral);color:#2A1210;font:600 .7rem var(--f-body);padding:0 5px;margin-left:4px}

main{min-height:60vh}
.view{padding-block:36px 72px;display:grid;gap:56px}
.view.tight{gap:28px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.lede{font-size:1.12rem;max-width:36em;color:var(--muted)}
.hl{background:linear-gradient(transparent 60%,var(--yellow) 60%,var(--yellow) 92%,transparent 92%)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.step .n{font:500 .78rem var(--f-mono);color:var(--coral-ink);display:block;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel.sunk{background:var(--sunk);border-color:transparent}
.price{font:600 1.9rem var(--f-display)}
.price small{font:500 .88rem var(--f-body);color:var(--muted)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist svg{flex:none;width:20px;height:20px;color:var(--good);margin-top:2px}
.feetable{width:100%;border-collapse:collapse;font-size:.93rem}
.feetable td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.feetable td:last-child{text-align:right;font:500 .9rem var(--f-mono);white-space:nowrap;padding-left:12px}
.feetable tr:last-child td{border-bottom:0}
.banner{background:var(--yellow-soft);border-radius:12px;padding:12px 16px;font-size:.93rem;display:flex;gap:10px;align-items:flex-start}
.banner.teal{background:var(--teal-soft)}
.banner.coral{background:var(--coral-soft)}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--teal-fill)}
.card.off{opacity:.7}
.tile{position:relative;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;color:var(--tile-ink)}
.tile svg.art{width:30%;height:auto}
.t0{--tile:var(--teal-soft);background:var(--teal-soft)} .t1{--tile:var(--yellow-soft);background:var(--yellow-soft)}
.t2{--tile:var(--coral-soft);background:var(--coral-soft)} .t3{--tile:var(--cream-deep);background:var(--cream-deep)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 10px;font:600 .78rem var(--f-body);white-space:nowrap}
.tile .pill{position:absolute;top:12px;left:12px}
.tile img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.tile .pill,.tile .save,.tile .close{z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.save{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.save svg{width:18px;height:18px}
.save[aria-pressed="true"]{color:var(--coral)}
.save[aria-pressed="true"] svg path{fill:currentColor}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{color:var(--muted);font-size:.88rem}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;font-size:.76rem;font-weight:600;color:var(--ink);align-self:flex-start}
.badge:hover{border-color:var(--teal-fill)}
.badge svg{width:15px;height:15px;color:var(--good)}
.badge.unv svg{color:var(--warn)}
.fit-strong{color:var(--good)} .fit-good{color:var(--teal)} .fit-maybe{color:var(--warn)} .fit-weak{color:var(--bad)} .fit-gate{color:var(--warn)} .fit-block{color:var(--bad)} .fit-info{color:var(--warn)}
.fitline{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fitline .est{font:500 .78rem var(--f-mono);color:var(--muted)}
.why{font-size:.9rem}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink)}
.flag.c{background:var(--coral-soft);color:var(--coral-ink)}
.flag.u{background:var(--yellow-soft);color:var(--warn)}
.flag.g{background:var(--teal-soft);color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.83rem}
.chip.must{border-color:var(--teal-fill);background:var(--teal-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,input[type=text],input[type=number],input[type=email],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:grid;gap:5px;font-size:.88rem;font-weight:600}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.more[open] summary{margin-bottom:16px}
.sec-h{display:grid;gap:6px}

/* layers */
.layer{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 42%,transparent);display:flex}
.layer.side{justify-content:flex-end}
.layer.center{align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:min(600px,100%);height:100%;overflow-y:auto;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.dialog{background:var(--bg);width:min(620px,100%);max-height:100%;overflow-y:auto;border-radius:18px;padding:24px;display:grid;gap:18px}
.sheet .tile{aspect-ratio:auto;height:200px}
.sheet .inner{padding:22px max(22px,env(safe-area-inset-right,0px)) 0 22px;display:grid;gap:26px}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:var(--surface);border:0;border-radius:999px;padding:6px 14px;font-weight:600}
.dialog .x{justify-self:end;background:none;border:0;font-weight:600;color:var(--muted);padding:0}
.photo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:var(--tile-ink);font-size:.7rem;text-align:center;padding:6px}
.ph svg{width:42%;height:auto}
.traits{width:100%;border-collapse:collapse;font-size:.92rem}
.traits td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.traits td:nth-child(2){text-align:right;font-weight:600;padding-left:10px}
.yes{color:var(--good)} .no{color:var(--bad)} .unk{color:var(--warn)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--teal-fill)}
.cost h4{margin-bottom:4px}
.total td{font-weight:700}
.calc{width:100%;border-collapse:collapse;font-size:.9rem}
.calc th{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.calc td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.calc td.n{font:500 .85rem var(--f-mono);white-space:nowrap;text-align:right}
.scroll{overflow-x:auto}

/* quiz */
.quiz{max-width:700px;margin:0 auto;width:100%}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.progress span{display:block;height:100%;background:var(--teal-fill);transition:width .25s}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.secs span{font-size:.78rem;font-weight:600;color:var(--muted);padding:3px 10px;border-radius:99px;background:var(--sunk)}
.secs span.on{background:var(--teal-soft);color:var(--teal)}
.secs span.done{text-decoration:line-through;opacity:.7}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-weight:500;width:100%}
.opt .box{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt.multi .box{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--teal-fill);background:var(--teal-soft)}
.opt[aria-pressed="true"] .box{border-color:var(--teal-fill);background:var(--teal-fill)}
.reqrow{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-right:10px}
.reqrow.on{border-color:var(--teal-fill);background:var(--teal-soft)}
.reqrow .opt{border:0;background:transparent;flex:1;min-width:200px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin:0 0 0 auto}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.8rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.locknote{font-size:.78rem;color:var(--teal);font-weight:600;padding:0 6px 0 0}
.quiz-nav{display:flex;justify-content:space-between;margin-top:28px;gap:12px}

/* tracker */
.app{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start}
.app .tile{aspect-ratio:1;border-radius:12px}
.app .tile svg.art{width:55%}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 2px}
.stepper div{display:grid;gap:5px;font-size:.74rem;font-weight:600;color:var(--muted)}
.stepper div::before{content:"";height:6px;border-radius:9px;background:var(--line)}
.stepper .done::before{background:var(--teal-fill)}
.stepper .now{color:var(--ink)}
.stepper .now::before{background:var(--coral)}
.stepper .skip{opacity:.5}
.reqbox{background:var(--coral-soft);border-radius:12px;padding:14px;display:grid;gap:10px}

/* provider */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:600 1.7rem var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.84rem}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.data{border-collapse:collapse;width:100%;min-width:780px;font-size:.92rem}
table.data th{font:500 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
table.data td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover td{background:var(--sunk)}
td.num{font:500 .88rem var(--f-mono);font-variant-numeric:tabular-nums}
.minibar{width:90px;height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.minibar span{display:block;height:100%;background:var(--teal-fill)}
.status{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--sunk)}
.st-sent{background:var(--sunk)} .st-review{background:var(--teal-soft);color:var(--teal)} .st-info{background:var(--coral-soft);color:var(--coral-ink)} .st-meeting{background:var(--yellow-soft);color:var(--warn)} .st-approved{background:var(--teal-soft);color:var(--good)} .st-declined{background:var(--sunk);color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:600;font-size:.88rem}
.switch .trk{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-pressed="true"] .trk{background:var(--teal-fill)}
.switch[aria-pressed="true"] .trk::after{left:19px}
.vstep{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.vstep:last-child{border-bottom:0}
.vnum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .8rem var(--f-mono);background:var(--sunk)}
.vnum.ok{background:var(--teal-fill);color:var(--on-teal)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th[scope=row]{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:150px}
.cmp thead th{font:600 1rem var(--f-display)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.role{display:grid;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.role:hover{border-color:var(--teal-fill)}
.role .tag{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--coral-ink)}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:.92rem}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .hero,.cols2{grid-template-columns:1fr;gap:28px}
  .cols3{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .acct{border-left:0;padding-left:0}
  nav.top{position:static}
  .form{grid-template-columns:1fr}
  .photo-row{grid-template-columns:repeat(2,1fr)}
  .app{grid-template-columns:72px 1fr}
  .stepper div{font-size:.66rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  f.push({k:'sched',name:'Time alone',short:'your schedule',w:10,pts:hp,st:hs,text:ht});
  // 4 budget (15)
  const c=costs(a,u,extras), B=BUDGET_TOP(u.budget);
  let bp,bs,bt;
  if(B==null){bp=.8;bs='unknown';bt=`You weren’t sure about budget. Typical care runs about ${money(c.base)} a month${c.ext?`, plus ${money(c.ext)} in extras`:''}.`}
  else if(c.base+c.ext<=B){bp=1;bs='good';bt=`About ${money(c.base+c.ext)} a month, within your ${money(B)} budget.`}
  else if(c.base<=B){bp=.55;bs='mixed';bt=`About ${money(c.base)} a month fits your budget, but extras could add ${money(c.ext)} (${c.extras.map(e=>e.kind==='possible'?'possible midday visits':'your care plan').join(', ')}).`}
  else{bp=Math.max(0,1-(c.base-B)/B);bs='concern';bt=`About ${money(c.base+c.ext)} a month, above your ${money(B)} budget.`}
  f.push({k:'budget',name:'Monthly cost',short:'your budget',w:15,pts:bp,st:bs,text:bt});
  // 5 personality (12)
  const want=(u.traits||[]).filter(t=>t!=='none');
  const hit=want.filter(t=>a.traits.includes(t));
  f.push({k:'pers',name:'Personality',short:'the personality you want',w:12,pts:!want.length?1:hit.length?Math.min(1,.5+.5*hit.length/Math.min(2,want.length)):.15,st:!want.length||hit.length?'good':'concern',text:!want.length?'No personality preference.':hit.length?`Matches what you want: ${hit.join(', ')}.`:`Described as ${a.traits.join(', ')}, not ${want.join(' or ')}.`});
  // 6 grooming (8)
  const g=u.groom||0;
  f.push({k:'groom',name:'Grooming',short:'your grooming preference',w:8,pts:!g||a.groom<=g?1:.3,st:!g||a.groom<=g?'good':'concern',text:!g?'No grooming preference.':a.groom<=g?`Grooming needs (${['','minimal','moderate','high'][a.groom]}) fit your preference.`:`Needs ${['','minimal','moderate','high'][a.groom]} grooming; you prefer ${['','minimal','moderate','high'][g]}.`});
  // 7 age (6)
  const AG=['baby','young','adult','senior'];const ad=u.age==='none'?0:Math.abs(AG.indexOf(u.age)-AG.indexOf(a.ag));
  f.push({k:'age',name:'Age',short:'your age preference',w:6,pts:ad===0?1:ad===1?.6:.3,st:ad===0?'good':'mixed',text:u.age==='none'?'No age preference.':ad===0?`${a.age}, the age you prefer.`:`${a.age}, not the age you prefer.`});
  // 8 size (5)
  const sz=a.sp!=='dog'||!u.size||u.size==='any'||a.size===u.size;
  f.push({k:'size',name:'Size',short:'your size preference',w:5,pts:sz?1:.4,st:sz?'good':'mixed',text:a.sp!=='dog'?'Size doesn’t apply to cats.':u.size==='any'?'No size preference.':sz?'The size you prefer.':`About ${a.wt} lb, not the size you prefer.`});
  // 9 distance (5)
  const dok=miles(a)<=u.travel;
  f.push({k:'dist',name:'Distance',short:'your travel range',w:5,pts:dok?1:.3,st:dok?'good':'concern',text:dok?`${miles(a)} mi away, within your range.`:`${miles(a)} mi away, beyond your ${u.travel}-mile range.`});
  // 10 nice-to-haves (4)
  const nl=niceList(u,m);
  let np=1,nt='No nice-to-haves selected.',nst='good';
  if(nl.length){const vals=nl.map(k=>reqVal(a,k));np=vals.reduce((s,v)=>s+(v===true?1:v==null?.5:0),0)/nl.length;
    const met=nl.filter((k,i)=>vals[i]===true).map(k=>REQ_SHORT[k]),miss=nl.filter((k,i)=>vals[i]===false).map(k=>REQ_SHORT[k]),unk=nl.filter((k,i)=>vals[i]==null).map(k=>REQ_SHORT[k]);
    nt=[met.length?'Has: '+met.join(', ')+'.':'',miss.length?'Missing: '+miss.join(', ')+'.':'',unk.length?'Unknown: '+unk.join(', ')+'.':''].filter(Boolean).join(' ');nst=np===1?'good':np>=.5?'mixed':'concern'}
  f.push({k:'nice',name:'Nice-to-haves',short:'your nice-to-haves',w:4,pts:np,st:nst,text:nt});
  // concerns & unknowns
  f.forEach(x=>{if(x.st==='concern'&&x.k!=='sched')concerns.unshift(x.text)});
  if(hs!=='good'&&gk!=='careplan')concerns.unshift(ht);
  const UNK={kids:'around children',dogs:'around dogs',cats:'around cats',apt:'apartment living',ht:'house-training',vocal:'noise level'};
  Object.keys(UNK).forEach(k=>{if(a[k]===null&&!(k==='apt'&&a.sp==='cat'))unknowns.push(UNK[k])});
  if(u.restrict==='limits')concerns.push('Get written landlord approval before applying.');
  if(u.allergy==='yes'||u.allergy==='mild')concerns.push('No pet is allergen-free. Spend time with this animal before committing.');
  let score=Math.round(f.reduce((s,x)=>s+x.w*x.pts,0));
  if(gk==='careplan')score=Math.min(score,55);
  if(gk==='info')score=Math.min(score,74);
  let lbl,cls;
  if(gk==='blocked'){lbl='Not a match';cls='fit-block'}
  else if(gk==='careplan'){lbl='Needs a care plan';cls='fit-gate'}
  else if(gk==='info'){lbl='Needs info first';cls='fit-info'}
  else if(score>=80){lbl='Strong fit';cls='fit-strong'}
  else if(score>=65){lbl='Good fit';cls='fit-good'}
  else if(score>=50){lbl='Worth a conversation';cls='fit-maybe'}
  else{lbl='Weak fit';cls='fit-weak'}
  const good=f.filter(x=>x.st==='good'&&x.pts>=.8&&!/^No /.test(x.text)).sort((x,y)=>y.w-x.w).slice(0,3).map(x=>x.short);
  const summary=good.length?`Fits ${good.length>1?good.slice(0,-1).join(', ')+' and '+good.at(-1):good[0]}.`:'Few of your answers line up with this animal.';
  return {gate:gk,gates:gate,score,label:lbl,cls,factors:f,concerns:[...new Set(concerns)],unknowns,mustMet,summary,costs:c};
}

function route(){
  let v=location.hash.slice(1);
  if(!ROUTES[v])v=S.role==='adopter'?'matches':isProv()?'dashboard':'home';
  const need=ROUTES[v];
  if(need==='adopter'&&S.role!=='adopter'||need==='provider'&&!isProv()){S.after=v;v='login'}
  if(v==='quiz'&&(!S.draft||S.reset)){S.draft=clone(S.answers);S.qid=S.jump||'species';S.jump=null;S.reset=false}
  if(v!=='quiz')S.draft=null;

}

 'verify-me':el=>{S.verified=true;save();closeLayer();toast('ID verified (demo).');rerender();if(el.dataset.id)sharePreview(+el.dataset.id)},
 send:el=>sendApp(+el.dataset.id),
 shared:el=>{const a=A(el.dataset.id);openLayer(`<div class="stack"><span class="eyebrow">Shared with ${esc(P(a).name)}</span><h2>What you shared</h2><table class="feetable"><tbody>${sharedFields(a).map(r=>`<tr><td class="muted">${r[0]}</td><td style="text-align:left;font:inherit;white-space:normal">${esc(r[1])}</td></tr>`).join('')}</tbody></table><p class="small muted">Shown as it is today. Updating your profile updates what they see.</p></div>`)},
 answer:el=>{const app=S.apps.find(x=>x.id===el.dataset.id);if(/landlord/i.test(app.request||''))S.prof.landlord=true;app.status='review';app.hist.push(['review',TODAY]);app.request=null;save();rerender();toast('Sent. The application is back under review.')},
 prof:el=>{S.prof[el.dataset.k]=true;save();rerender();toast('Added (demo).')},
 premium:()=>{S.premium=!S.premium;S.apps.forEach(x=>{if(x.mine)x.premium=S.premium});save();rerender();toast(S.premium?'Priority is on (demo). No charge in the prototype.':'Priority is off.')},
 papp:el=>openProvApp(el.dataset.id),
 preq:el=>{const app=S.apps.find(x=>x.id===el.dataset.id);app.status='info';app.request=$('#reqmsg').value||('Please send your '+$('#reqsel').value.toLowerCase()+'.');app.hist.push(['info',TODAY]);save();closeAll();rerender();toast(`Request sent to ${appView(app).name}.`)},
 pstatus:el=>{const app=S.apps.find(x=>x.id===el.dataset.id),s=el.dataset.s;app.status=s;if(s==='meeting')app.meet=$('#meetsel').value+' at '+P(A(app.animal)).name;app.hist.push([s,TODAY]);save();closeAll();rerender();toast(`Status updated: ${STATUS_LBL[s]}.`)},
 unavail:el=>{const id=+el.dataset.id;S.unavail=S.unavail.includes(id)?S.unavail.filter(x=>x!==id):[...S.unavail,id];save();const inLayer=el.closest('.layer');if(inLayer)closeAll();rerender();toast(`${A(id).name} is now ${S.unavail.includes(id)?'unavailable':'available'}.`)},
 nbstep:el=>{S.nb[el.dataset.k]=true;if(Object.values(S.nb).every(Boolean)){S.nbVerified=true;PROVIDERS.b4.verified=true;PROVIDERS.b4.rec=B4REC;PROVIDERS.b4.feed='just now';toast('Verified. You can now add listings.')}save();rerender()},
 // quiz
 'q-opt':el=>{const q=QUESTIONS.find(x=>x.id===S.qid),d=S.draft,o=optsOf(q,d).find(o=>String(o[0])===el.dataset.v),v=o[0];
   if(q.multi){let cur=[...(d[q.id]||[])];const none=v==='none';if(none)cur=['none'];else{cur=cur.filter(x=>x!=='none');if(cur.includes(v))cur=cur.filter(x=>x!==v);else{if(q.max&&cur.length>=q.max){toast(`Pick up to ${q.max}.`);return}cur.push(v)}}if(!cur.length)cur=['none'];d[q.id]=cur;rerender()}
   else{d[q.id]=v;rerender();setTimeout(()=>{if(S.qid===q.id)ACT['q-next']()},200)}},
 'q-req':el=>{const d=S.draft,v=el.dataset.v;d.req=d.req||{};if(v==='none')d.req={};else if(d.req[v])delete d.req[v];else d.req[v]='must';rerender()},
 'q-lvl':el=>{S.draft.req[el.dataset.v]=el.dataset.l;rerender()},
 'q-back':()=>{const vis=visibleQs(S.draft),i=vis.findIndex(q=>q.id===S.qid);if(i>0){S.qid=vis[i-1].id;rerender()}},
 'q-next':()=>{const vis=visibleQs(S.draft),i=vis.findIndex(q=>q.id===S.qid);
   if(i<vis.length-1){S.qid=vis[i+1].id;render();window.scrollTo(0,0);return}
   const d=S.draft;if(d.species==='cat')d.size='any';if(d.away<5)d.careplan='none';
   S.answers=clone(d);S.sample=false;S.draft=null;save();location.hash='matches'},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A'&&el.dataset.act==='closeall'){closeAll();return}
  const fn=ACT[el.dataset.act];if(!fn)return;
  e.preventDefault();e.stopPropagation();fn(el);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]')){ACT[e.target.dataset.act](e.target)}});
document.addEventListener('submit',e=>{
  if(e.target.id==='locform'){e.preventDefault();const q=document.getElementById('locq').value,pl=findPlace(q);
    if(!pl){S.locErr='We couldn\u2019t find that place. Try a Pennsylvania city or ZIP code, like State College or 16801.';rerender();return}
    S.loc=pl;S.locErr='';save();rerender();toast(`Showing animals near ${pl}, PA.`);return}
  if(e.target.id!=='addform')return;e.preventDefault();
  const g=id=>document.getElementById(id).value, tri=id=>({null:null,true:true,false:false})[g(id)];
  const pid=myProv(),sp=g('nf-sp'),id=100+S.custom.length+1,fee=+g('nf-fee')||0;
  S.custom.push({id,name:g('nf-name')||'New animal',sp,breed:g('nf-breed')||'Mixed breed',age:g('nf-age')||'Unknown age',ag:/wk|mo/i.test(g('nf-age'))?'baby':'adult',size:sp==='dog'?'M':undefined,wt:sp==='dog'?35:undefined,ex:+g('nf-ex')||45,train:2,groom:1,shed:3,vocal:null,alone:+g('nf-alone')||5,apt:tri('nf-apt'),kids:tri('nf-kids'),dogs:tri('nf-dogs'),cats:tri('nf-cats'),ht:tri('nf-ht'),outdoor:false,traits:['social'],about:g('nf-about'),obs:[ACCOUNTS[S.role].sub.split(': ')[1]||'Provider staff','Nov 9, 2026','first listing'],m:sp==='dog'?{food:45,vet:25,prev:25,groom:10,misc:15}:{food:25,vet:12,prev:8,groom:0,misc:12},fee,p:pid,mi:{r1:4,r2:11,r3:19,b1:38,b2:52,b3:45,b4:24}[pid]||20,wait:PROVIDERS[pid].kind==='breeder'?0:undefined});
  save();rerender();toast('Listing added. Adopters can see it now.');
});

/* ---------- boot ---------- */
window.claude?.hot?.ready ? window.claude.hot.ready(()=>{render()}) : render();
</script>
